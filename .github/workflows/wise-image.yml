name: WISE image

# Builds and publishes ghcr.io/ironalloy/livesync-bridge from the `wise` branch of this
# fork. Runs upstream's own gates (check, lint, unit tests, CouchDB integration tests)
# first, so a failing change never produces an image.
#
# Every push to `wise` moves `:latest`. Production hosts may watch that tag, so only push
# to `wise` when you intend to ship. Pull requests into `wise` and `workflow_dispatch` runs
# on other branches build and test but do NOT publish.

on:
  push:
    branches: [wise]
    paths-ignore:
      - "**.md"
      - "docker/wise/config.example.json"
  pull_request:
    branches: [wise]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ironalloy/livesync-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno task check
      - run: deno task lint
      - run: deno task test
      - name: Start CouchDB
        run: docker compose -f test/integration/compose.yml up --detach --wait
      - run: deno task test:integration

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # A PAT secret (GHCR_PAT) wins if set; otherwise the workflow token, which needs
          # this repository to have Write access on the package (Package settings ->
          # Manage Actions access).
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wise/Dockerfile
          push: ${{ github.ref == 'refs/heads/wise' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
